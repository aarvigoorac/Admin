<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homepage Layout - Aarvi Stores</title>
  <style>
    :root {
      --bg-color: #f1f3f6;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0;
      --skeleton-base: #e0e0e0;
      --skeleton-shine: #f5f5f5;
      --success: #137333;
      --success-bg: #e6f4ea;
      --warning: #b3261e;
      --warning-bg: #f9dedc;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --skeleton-base: #333333;
        --skeleton-shine: #444444;
        --success: #81c995;
        --success-bg: #1e3a29;
        --warning: #f2b8b5;
        --warning-bg: #410e0b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; background-color: var(--bg-color); color: var(--text-main); }

    .page-container { width: 100%; max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 90px; }

    .page-header { font-size: 22px; font-weight: 800; padding: 12px 0; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .slot-count-badge { font-size: 13px; background: var(--surface-color); border: 1.5px solid var(--border); padding: 6px 12px; border-radius: 50px; color: var(--text-sub); font-weight: 700; }

    /* 16 Slots Line-by-Line List Container */
    .slots-list { display: flex; flex-direction: column; gap: 12px; }

    /* Slot Row Card */
    .slot-card { background: var(--surface-color); border-radius: 16px; padding: 12px 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease; user-select: none; }
    .slot-card:active { transform: scale(0.97); background: var(--bg-color); }

    .slot-number { font-size: 14px; font-weight: 800; color: var(--text-sub); width: 28px; text-align: center; flex-shrink: 0; background: var(--bg-color); padding: 4px; border-radius: 6px; border: 1px solid var(--border); }

    /* Empty Slot State */
    .slot-card.empty { border: 2px dashed var(--border); background: transparent; }
    .slot-card.empty:hover { border-color: var(--primary); }
    .empty-content { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--text-sub); }
    .empty-icon-box { width: 52px; height: 52px; border-radius: 12px; background: var(--surface-color); border: 1.5px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 24px; font-weight: 700; flex-shrink: 0; }
    .empty-text { font-size: 15px; font-weight: 700; color: var(--text-sub); }

    /* Filled Slot Content */
    .slot-img { width: 52px; height: 52px; border-radius: 10px; background: var(--bg-color); object-fit: contain; flex-shrink: 0; border: 1px solid var(--border); padding: 4px; mix-blend-mode: multiply; }
    @media (prefers-color-scheme: dark) { .slot-img { mix-blend-mode: normal; } }
    .slot-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .slot-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .slot-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .slot-price { color: var(--primary); font-weight: 800; }
    .slot-action-hint { font-size: 12px; font-weight: 800; color: var(--primary); background: var(--bg-color); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }

    /* Strict Detailed Skeleton Loading */
    .skeleton { background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%) !important; background-size: 200% 100% !important; animation: shimmer 1.5s infinite !important; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Layer 1: Slot Options Bottom Sheet */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); z-index: 1999; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-color); z-index: 2000; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); max-height: 80vh; }
    .bottom-sheet.active { transform: translateY(0); }
    
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface-color); border-bottom: 1px solid var(--border); border-radius: 24px 24px 0 0; position: sticky; top: 0; z-index: 10; }
    .btn-close { background: var(--bg-color); border: none; color: var(--text-main); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: transform 0.1s; }
    .btn-close:active { transform: scale(0.9); }
    .modal-title { font-size: 18px; font-weight: 800; }
    .sheet-scroll { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-bottom: 40px; }

    .sheet-product-preview { background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; }
    .sheet-product-img { width: 64px; height: 64px; border-radius: 12px; background: var(--bg-color); object-fit: contain; border: 1px solid var(--border); padding: 4px; flex-shrink: 0; mix-blend-mode: multiply;}
    @media (prefers-color-scheme: dark) { .sheet-product-img { mix-blend-mode: normal; } }
    
    .sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn-sheet { width: 100%; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s; }
    .btn-sheet:active { transform: scale(0.97); }
    .btn-change { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(40, 116, 240, 0.25); }
    .btn-remove { background: var(--warning-bg); color: var(--warning); border: 1.5px solid var(--warning); }

    /* Layer 2: Inventory Search Modal (Full Screen) */
    #overlay-search { z-index: 2499; }
    .full-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 2500; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; }
    .full-modal.active { transform: translateY(0); }
    
    .full-header { display: flex; flex-direction: column; background: var(--surface-color); border-bottom: 1px solid var(--border); padding: 16px; gap: 12px; }
    .search-wrap { flex: 1; position: relative; width: 100%; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 16px; width: 20px; height: 20px; stroke: var(--text-sub); stroke-width: 2.5; transition: stroke 0.3s ease; }
    .search-input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 15px; outline: none; transition: border-color 0.3s ease, box-shadow 0.3s ease; }
    .search-input:focus { border-color: var(--primary); background: var(--surface-color); box-shadow: 0 0 0 4px rgba(40, 116, 240, 0.1); }
    .search-input:focus + svg { stroke: var(--primary); }
    .clear-btn { position: absolute; right: 16px; background: var(--skeleton-base); border: none; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); }
    .clear-btn svg { left: auto; position: static; width: 14px; height: 14px; stroke: currentColor; }

    .full-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Enlarged Inventory Item Cards */
    .inventory-item { background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: transform 0.15s; user-select: none; }
    .inventory-item:active { transform: scale(0.96); background: var(--bg-color); }
    .inv-img { width: 80px; height: 80px; border-radius: 12px; background: var(--bg-color); object-fit: contain; border: 1px solid var(--border); padding: 6px; flex-shrink: 0; mix-blend-mode: multiply; }
    @media (prefers-color-scheme: dark) { .inv-img { mix-blend-mode: normal; } }
    .inv-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .inv-name { font-size: 16px; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .inv-meta { font-size: 15px; font-weight: 800; color: var(--primary); display: flex; gap: 12px; }
    .btn-select { font-size: 13px; font-weight: 800; background: var(--success-bg); color: var(--success); border: 1px solid var(--success); padding: 8px 16px; border-radius: 8px; flex-shrink: 0; }

    .loading-more { display: none; text-align: center; padding: 10px; color: var(--text-sub); font-size: 14px; font-weight: 600; width: 100%; align-items: center; justify-content: center; gap: 8px; }
    .loading-more.active { display: flex; }
    .loading-more svg { animation: spin 1s linear infinite; width: 20px; height: 20px; stroke: currentColor; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .sentinel { height: 20px; width: 100%; }

    /* Layer 3 Dynamic HTML Confirmation Dialog */
    #overlay-dialog { z-index: 2999; }
    .dialog-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: var(--surface-color); z-index: 3000; border-radius: 20px; padding: 24px; width: 90%; max-width: 360px; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .dialog-box.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    
    .dialog-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; background: var(--warning-bg); color: var(--warning); }
    .dialog-icon svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2.5; }
    .dialog-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
    .dialog-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
    
    .dialog-actions { display: flex; width: 100%; gap: 12px; }
    .btn-dialog { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; border: none; cursor: pointer; transition: transform 0.15s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-dialog:active { transform: scale(0.95); }
    .btn-dialog:disabled { opacity: 0.6; pointer-events: none; }
    .btn-dialog.cancel { background: var(--bg-color); color: var(--text-main); border: 1.5px solid var(--border); }
    .btn-dialog.confirm { background: var(--warning); color: white; box-shadow: 0 4px 12px rgba(179, 38, 30, 0.2); }

  </style>
</head>
<body>

  <div class="page-container">
    <div class="page-header">
      Homepage Layout
      <span class="slot-count-badge" id="slot-counter">Loading...</span>
    </div>

    <!-- 16 Line-by-Line Slots Feed -->
    <div class="slots-list" id="slots-list">
      <!-- 0ms Hardcoded Skeletons exactly 16 times -->
      <script>
        document.write(Array(16).fill(`
          <div class="slot-card" style="pointer-events:none;">
            <div class="skeleton slot-number" style="height:28px; border:none;"></div>
            <div class="skeleton" style="width:52px; height:52px; border-radius:10px; flex-shrink:0;"></div>
            <div style="display:flex; flex-direction:column; gap:8px; flex:1;">
              <div class="skeleton" style="height:16px; width:60%; border-radius:4px;"></div>
              <div class="skeleton" style="height:14px; width:40%; border-radius:4px;"></div>
            </div>
            <div class="skeleton" style="width:60px; height:28px; border-radius:8px;"></div>
          </div>
        `).join(''));
      </script>
    </div>
  </div>

  <!-- Layer 1: Slot Options Bottom Sheet -->
  <div class="modal-overlay" id="overlay-sheet"></div>
  <div class="bottom-sheet" id="modal-sheet">
    <div class="modal-header">
      <div class="modal-title" id="sheet-title">Slot Options</div>
      <button class="btn-close" id="btn-close-sheet">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="sheet-scroll">
      <div class="sheet-product-preview" id="sheet-preview">
        <!-- Filled dynamically -->
      </div>
      <div class="sheet-actions">
        <button class="btn-sheet btn-change" id="btn-sheet-change">Change Product</button>
        <button class="btn-sheet btn-remove" id="btn-sheet-remove">Remove from Slot</button>
      </div>
    </div>
  </div>

  <!-- Layer 2: Inventory Search Modal (Full Screen) -->
  <div class="modal-overlay" id="overlay-search"></div>
  <div class="full-modal" id="modal-search">
    <div class="full-header">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="modal-title" id="search-modal-title">Select Product</div>
        <button class="btn-close" id="btn-close-search">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
        <input type="text" id="inventory-search-input" class="search-input" placeholder="Search inventory keywords...">
        <button class="clear-btn" id="clear-search-btn">
          <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
    </div>
    <div class="full-scroll" id="inventory-list">
      <!-- Inventory rows injected here -->
    </div>
    <div class="loading-more" id="loading-inventory">
      <svg fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4"/></svg>
      Loading inventory...
    </div>
    <div class="sentinel" id="inventory-sentinel"></div>
  </div>

  <!-- Layer 3: Dynamic HTML Confirmation Dialog -->
  <div class="modal-overlay" id="overlay-dialog"></div>
  <div class="dialog-box" id="modal-dialog">
    <div class="dialog-icon">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    </div>
    <div class="dialog-title">Clear Slot?</div>
    <div class="dialog-desc">Are you sure you want to remove this product from the homepage? This will immediately reflect on the customer app.</div>
    <div class="dialog-actions">
      <button class="btn-dialog cancel" id="btn-dialog-cancel">Cancel</button>
      <button class="btn-dialog confirm" id="btn-dialog-confirm">Remove</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../config.js';
    import { collection, query, where, orderBy, limit, startAfter, getDocs, getDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Clean SVG Fallback Placeholder for missing images
    const defaultPlaceholderImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cccccc'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>";
    
    // UI Elements
    const slotsList = document.getElementById('slots-list');
    const slotCounter = document.getElementById('slot-counter');
    
    // Layer 1
    const modalSheet = document.getElementById('modal-sheet');
    const overlaySheet = document.getElementById('overlay-sheet');
    const sheetPreview = document.getElementById('sheet-preview');
    const btnSheetChange = document.getElementById('btn-sheet-change');
    const btnSheetRemove = document.getElementById('btn-sheet-remove');

    // Layer 2
    const modalSearch = document.getElementById('modal-search');
    const overlaySearch = document.getElementById('overlay-search');
    const inventoryList = document.getElementById('inventory-list');
    const inventorySearchInput = document.getElementById('inventory-search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const loadingInventory = document.getElementById('loading-inventory');
    const sentinelInventory = document.getElementById('inventory-sentinel');
    const searchModalTitle = document.getElementById('search-modal-title');

    // Layer 3 Confirm Dialog
    const modalDialog = document.getElementById('modal-dialog');
    const overlayDialog = document.getElementById('overlay-dialog');
    const btnDialogConfirm = document.getElementById('btn-dialog-confirm');

    // Global State
    let modalStack = [];
    let currentLayoutData = {}; 
    let activeSlotIndex = null;
    let inventorySearchDebounce;

    // Inventory Pagination State
    let lastInventoryDoc = null;
    let isFetchingInventory = false;
    let hasMoreInventory = true;
    let currentSearchKeyword = '';

    // Smart Image Extractor based on search.html structure
    const getProductImage = (prod) => {
      if (prod.images && prod.images.thumbnail) return prod.images.thumbnail;
      if (prod.image) return prod.image;
      if (prod.imageUrl) return prod.imageUrl;
      return defaultPlaceholderImg;
    };

    const generateInventorySkeletons = (count = 4) => Array(count).fill(`
      <div class="inventory-item" style="pointer-events:none;">
        <div class="skeleton inv-img" style="border:none;"></div>
        <div class="inv-info" style="gap:8px;">
          <div class="skeleton" style="height:18px; width:80%; border-radius:4px;"></div>
          <div class="skeleton" style="height:16px; width:40%; border-radius:4px;"></div>
        </div>
      </div>
    `).join('');

    onAuthStateChanged(auth, (user) => {
      if (user) fetchHomepageLayout();
    });

    // --- 1. Fetch Layout Document ---
    async function fetchHomepageLayout() {
      try {
        const layoutDocRef = doc(db, "layout", "homepage");
        const layoutSnap = await getDoc(layoutDocRef);
        
        if (layoutSnap.exists()) {
          currentLayoutData = layoutSnap.data().slots || {};
        } else {
          currentLayoutData = {};
        }
        await renderSlotsFeed();
      } catch (err) {
        console.error("Failed to load layout:", err);
        slotsList.innerHTML = `<p style="color:var(--warning); text-align:center;">Failed to load homepage layout.</p>`;
      }
    }

    // --- 2. Render 16 Slots List ---
    async function renderSlotsFeed() {
      let filledCount = 0;
      const productIdsToFetch = [];
      
      for (let i = 1; i <= 16; i++) {
        const pId = currentLayoutData[i];
        if (pId) {
          filledCount++;
          if (!productIdsToFetch.includes(pId)) productIdsToFetch.push(pId);
        }
      }

      slotCounter.innerText = `${filledCount}/16 Slots Filled`;

      const productMap = {};
      if (productIdsToFetch.length > 0) {
        try {
          const promises = productIdsToFetch.map(id => getDoc(doc(db, "products", id)));
          const docs = await Promise.all(promises);
          docs.forEach(d => {
            if (d.exists()) productMap[d.id] = { id: d.id, ...d.data() };
          });
        } catch(e) { console.error("Error fetching slot products", e); }
      }

      slotsList.innerHTML = '';

      for (let i = 1; i <= 16; i++) {
        const pId = currentLayoutData[i];
        const product = pId ? productMap[pId] : null;

        const row = document.createElement('div');

        if (product) {
          row.className = 'slot-card';
          const imgSrc = getProductImage(product);
          row.innerHTML = `
            <div class="slot-number">${i}</div>
            <img src="${imgSrc}" class="slot-img" onerror="this.src='${defaultPlaceholderImg}'">
            <div class="slot-info">
              <div class="slot-name">${product.name || product.title || 'Unnamed Product'}</div>
              <div class="slot-meta">
                <span class="slot-price">₹${(product.price || 0).toLocaleString('en-IN')}</span>
              </div>
            </div>
            <div class="slot-action-hint">Manage</div>
          `;
          row.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(15);
            openSlotOptionsSheet(i, product);
          });
        } else {
          row.className = 'slot-card empty';
          row.innerHTML = `
            <div class="slot-number">${i}</div>
            <div class="empty-content">
              <div class="empty-icon-box">+</div>
              <div class="empty-text">Assign Product to Slot ${i}</div>
            </div>
          `;
          row.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(15);
            openInventorySearchModal(i);
          });
        }
        slotsList.appendChild(row);
      }
    }

    // --- 3. Hardware Back Button Routing System ---
    function pushModal(modalId) {
      modalStack.push(modalId);
      history.pushState({ modal: modalId }, '');
    }

    function closeTopModal() {
      const top = modalStack.pop();
      if (top === 'dialog') {
        modalDialog.classList.remove('active');
        overlayDialog.classList.remove('active');
      } else if (top === 'search') {
        modalSearch.classList.remove('active');
        overlaySearch.classList.remove('active');
      } else if (top === 'sheet') {
        modalSheet.classList.remove('active');
        overlaySheet.classList.remove('active');
        activeSlotIndex = null;
      }
    }

    window.addEventListener('popstate', () => {
      if (modalStack.length > 0) closeTopModal();
    });

    ['btn-close-sheet', 'overlay-sheet', 'btn-close-search', 'overlay-search', 'btn-dialog-cancel', 'overlay-dialog'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        if (modalStack.length > 0) history.back();
      });
    });

    // --- 4. Layer 1: Slot Options Sheet ---
    function openSlotOptionsSheet(slotIndex, product) {
      activeSlotIndex = slotIndex;
      document.getElementById('sheet-title').innerText = `Manage Slot #${slotIndex}`;
      
      const imgSrc = getProductImage(product);
      sheetPreview.innerHTML = `
        <img src="${imgSrc}" class="sheet-product-img" onerror="this.src='${defaultPlaceholderImg}'">
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
          <div style="font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-main);">${product.name || product.title}</div>
          <div style="font-size:14px; font-weight:800; color:var(--primary);">₹${(product.price || 0).toLocaleString('en-IN')}</div>
        </div>
      `;

      btnSheetChange.onclick = () => {
        if (navigator.vibrate) navigator.vibrate(15);
        
        // Instant visual swap from Layer 1 to Layer 2
        modalSheet.classList.remove('active');
        overlaySheet.classList.remove('active');
        
        // Safely swap the history state without triggering the back navigation popstate close
        modalStack.pop();
        history.replaceState({ modal: 'search' }, '');
        modalStack.push('search');
        
        // Setup and open Search Modal explicitly
        activeSlotIndex = slotIndex;
        searchModalTitle.innerText = `Assign to Slot #${slotIndex}`;
        inventorySearchInput.value = '';
        clearSearchBtn.style.display = 'none';
        currentSearchKeyword = '';
        lastInventoryDoc = null;
        hasMoreInventory = true;
        
        inventoryList.innerHTML = generateInventorySkeletons(4);
        document.getElementById('inventory-list').scrollTop = 0;
        
        fetchInventory(true);

        overlaySearch.classList.add('active');
        modalSearch.classList.add('active');
      };

      btnSheetRemove.onclick = () => {
        if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
        openConfirmModal(); // open layer 3
      };

      overlaySheet.classList.add('active');
      modalSheet.classList.add('active');
      pushModal('sheet');
    }

    // --- Layer 3: Native HTML Confirmation Modal ---
    function openConfirmModal() {
      overlayDialog.classList.add('active');
      modalDialog.classList.add('active');
      pushModal('dialog');
    }

    btnDialogConfirm.addEventListener('click', async () => {
      if (!activeSlotIndex) return;
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      
      const originalText = btnDialogConfirm.innerHTML;
      btnDialogConfirm.innerHTML = 'Removing...';
      btnDialogConfirm.disabled = true;

      try {
        await updateSlotAssignment(activeSlotIndex, null);
        history.back(); // Close Layer 3 (Dialog)
        history.back(); // Close Layer 1 (Bottom Sheet)
      } catch (err) {
        alert("Failed to remove product.");
      } finally {
        btnDialogConfirm.innerHTML = originalText;
        btnDialogConfirm.disabled = false;
      }
    });

    // --- 5. Layer 2: Inventory Search (Matched directly to search.html) ---
    function openInventorySearchModal(slotIndex) {
      activeSlotIndex = slotIndex;
      searchModalTitle.innerText = `Assign to Slot #${slotIndex}`;
      inventorySearchInput.value = '';
      clearSearchBtn.style.display = 'none';
      currentSearchKeyword = '';
      lastInventoryDoc = null;
      hasMoreInventory = true;
      
      inventoryList.innerHTML = generateInventorySkeletons(4);
      document.getElementById('inventory-list').scrollTop = 0;
      
      fetchInventory(true);

      overlaySearch.classList.add('active');
      modalSearch.classList.add('active');
      pushModal('search');
    }

    inventorySearchInput.addEventListener('input', (e) => {
      clearTimeout(inventorySearchDebounce);
      // Strips special characters just like search.html
      const val = e.target.value.trim().toLowerCase().replace(/[\.\#\$\[\]]/g, '');
      
      if (val.length > 0) clearSearchBtn.style.display = 'flex';
      else clearSearchBtn.style.display = 'none';

      inventorySearchDebounce = setTimeout(() => {
        currentSearchKeyword = val;
        fetchInventory(true, val);
      }, 300); // Debounce speed matched to search.html
    });

    clearSearchBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      inventorySearchInput.value = '';
      clearSearchBtn.style.display = 'none';
      currentSearchKeyword = '';
      fetchInventory(true, '');
      inventorySearchInput.focus();
    });

    async function fetchInventory(isNew = false, keyword = '') {
      if (isFetchingInventory || (!hasMoreInventory && !isNew)) return;
      isFetchingInventory = true;
      
      if (isNew) {
        if (inventoryList.children.length === 0 || currentSearchKeyword) {
          inventoryList.innerHTML = generateInventorySkeletons(4);
        }
        lastInventoryDoc = null;
        hasMoreInventory = true;
      } else {
        loadingInventory.style.display = 'flex';
      }

      try {
        let q;
        if (keyword.length > 0) {
          const searchWords = keyword.split(' ').filter(word => word.trim().length > 0);
          const queryConstraints = searchWords.map(word => where(`searchKeywords.${word}`, "==", true));
          
          // No pagination for exact search, strict limit to 10
          q = query(collection(db, "products"), ...queryConstraints, limit(10));
          hasMoreInventory = false; 
        } else {
          // Default query strictly set to limit(10) with normal pagination
          if (isNew) {
            q = query(collection(db, "products"), limit(10));
          } else {
            q = query(collection(db, "products"), startAfter(lastInventoryDoc), limit(10));
          }
        }

        const snap = await getDocs(q);
        
        if (isNew) inventoryList.innerHTML = '';
        loadingInventory.style.display = 'none';

        if (snap.empty && isNew) {
          inventoryList.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-sub); font-weight:600;">No products match your search.</div>`;
          isFetchingInventory = false;
          return;
        }

        if (snap.docs.length < 10) hasMoreInventory = false;
        else lastInventoryDoc = snap.docs[snap.docs.length - 1];

        snap.docs.forEach(docSnap => {
          const prod = docSnap.data();
          prod.id = docSnap.id;

          const row = document.createElement('div');
          row.className = 'inventory-item';
          const imgSrc = getProductImage(prod);
          
          row.innerHTML = `
            <img src="${imgSrc}" class="inv-img" onerror="this.src='${defaultPlaceholderImg}'">
            <div class="inv-info">
              <div class="inv-name">${prod.name || prod.title || 'Unnamed Product'}</div>
              <div class="inv-meta">₹${(prod.price || 0).toLocaleString('en-IN')}</div>
            </div>
            <div class="btn-select">Assign</div>
          `;

          row.addEventListener('click', async () => {
            if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
            
            const btn = row.querySelector('.btn-select');
            btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="animation: spin 1s linear infinite; vertical-align:middle;"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"></circle><path d="M12 2v4"></path></svg>`;
            
            await updateSlotAssignment(activeSlotIndex, prod.id);
            // We must go back in history to properly clear the modal state
            history.back(); 
          });

          inventoryList.appendChild(row);
        });

      } catch (err) {
        console.error("Inventory fetch error:", err);
        loadingInventory.style.display = 'none';
      }
      isFetchingInventory = false;
    }

    // Scroll Bug Fix: Root margin set to 0px, heavily locked logic
    const inventoryObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isFetchingInventory && hasMoreInventory) {
        fetchInventory(false, currentSearchKeyword);
      }
    }, { rootMargin: "0px" });
    inventoryObserver.observe(sentinelInventory);

    // --- 6. Save Assignment to Single Homepage Document ---
    async function updateSlotAssignment(slotIndex, productId) {
      try {
        currentLayoutData[slotIndex] = productId; 

        const layoutDocRef = doc(db, "layout", "homepage");
        await setDoc(layoutDocRef, {
          slots: currentLayoutData,
          updatedAt: new Date().toISOString()
        }, { merge: true });

        if (navigator.vibrate) navigator.vibrate(20);
        await renderSlotsFeed(); 
      } catch (err) {
        console.error("Failed to update layout slot:", err);
        alert("Failed to save slot assignment.");
      }
    }
  </script>
</body>
</html>
